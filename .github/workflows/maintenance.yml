# Connects this repository to the shared maintenance in
# pablosancheznunez/research-tools-ops. Releases follow CRAN (see cran-checks.yml).
name: Maintenance

on:
  pull_request_target:
  workflow_run:
    workflows: [CI, CRAN checks]
    types: [completed]
    branches: [main]

jobs:
  risk:
    if: github.event_name == 'pull_request_target'
    uses: pablosancheznunez/research-tools-ops/.github/workflows/risk-gate.yml@main
    permissions:
      contents: write
      pull-requests: write

  repair:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event != 'pull_request'
    uses: pablosancheznunez/research-tools-ops/.github/workflows/repair.yml@main
    with:
      run_id: ${{ github.event.workflow_run.id }}
    secrets: inherit
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
