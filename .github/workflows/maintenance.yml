# Connects this repository to the shared maintenance in
# pablosancheznunez/research-tools-ops.
name: Maintenance

on:
  pull_request_target:
  workflow_run:
    workflows: [CI, CRAN checks]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:

jobs:
  risk:
    if: github.event_name == 'pull_request_target'
    uses: pablosancheznunez/research-tools-ops/.github/workflows/risk-gate.yml@main
    permissions:
      contents: write
      pull-requests: write

  repair:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event != 'pull_request'
    uses: pablosancheznunez/research-tools-ops/.github/workflows/repair.yml@main
    with:
      run_id: ${{ github.event.workflow_run.id }}
    secrets: inherit
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write

  release:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: pablosancheznunez/research-tools-ops/.github/workflows/auto-release.yml@main
    with:
      setup: sudo apt-get install -y -qq r-base-core >/dev/null && sudo Rscript -e 'install.packages(c("knitr","rmarkdown","testthat"), repos="https://cloud.r-project.org", quiet=TRUE)'
      test: R CMD build --no-build-vignettes . && _R_CHECK_FORCE_SUGGESTS_=false R CMD check --no-manual --ignore-vignettes uxlearn_*.tar.gz
    permissions:
      contents: write
